resolver: lts-18.18
flags:
  xmobar:
    with_xft: true
    with_utf8: true
    with_mpd: true
    with_alsa: true
    with_xpm: true
  xmonad-contrib:
    use_xft: true
packages:
  - xmonad/
  - xmonad-contrib/
  - xmobar
  - xmo-config
extra-deps:
  - libmpd-0.9.2.0@sha256:b514fe25cb131a8a563f1162524358b374c8ce7dde0de073f8a6849496fbe8c8,4010
  - X11-1.10

ghc-options:
  xmonad-contrib: '-j'
  xmobar: '-j'
