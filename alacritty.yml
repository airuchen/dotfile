# Configuration for Alacritty, the GPU enhanced terminal emulator.

window:
  decorations: none

# Font configuration
font:
  # Normal (roman) font face
  normal:
    # Font family
    family: DejaVu Sans Mono

    # The `style` can be specified to pick a specific face.
    style: Regular

  size: 12.0

# Colors (Gruvbox dark)
colors:
  # Default colors
  primary:
    # hard contrast: background = '#1d2021'
    background: '#282828'
    # soft contrast: background = '#32302f'
    foreground: '#ebdbb2'

  # Normal colors
  normal:
    black:   '#282828'
    red:     '#cc241d'
    green:   '#98971a'
    yellow:  '#d79921'
    blue:    '#458588'
    magenta: '#b16286'
    cyan:    '#689d6a'
    white:   '#a89984'

  # Bright colors
  bright:
    black:   '#928374'
    red:     '#fb4934'
    green:   '#b8bb26'
    yellow:  '#fabd2f'
    blue:    '#83a598'
    magenta: '#d3869b'
    cyan:    '#8ec07c'
    white:   '#ebdbb2'

  search:
    # Allowed values are CellForeground/CellBackground, which reference the
    # affected cell, or hexadecimal colors like #ff00ff.
    matches:
      foreground: '#b8bb26'
      background: '#3c3836'
    focused_match:
      foreground: '#3c3836'
      background: '#79740e'
    footer_bar:
      #foreground: '#d65d0e'
      foreground: '#b8bb26'
      background: '#3c3836'

  # Keyboard regex hints
  hints:
    # Fist character in the hint label
    #
    # Allowed values are CellForeground/CellBackground, which reference the
    # affected cell, or hexadecimal colors like #ff00ff.
    start:
      foreground: '#282828'
      background: '#fb4934'

    # All characters after the first one in the hint label
    #
    # Allowed values are CellForeground/CellBackground, which reference the
    # affected cell, or hexadecimal colors like #ff00ff.
    end:
      foreground: '#ebdbb2'
      background: '#cc241d'

  # Line indicator
  #
  # Color used for the indicator displaying the position in history during
  # search and vi mode.
  #
  # By default, these will use the opposing primary color.
  line_indicator:
    foreground: '#d65d0e'
    background: '#282828'

# Background opacity
#
# Window opacity as a floating point number from `0.0` to `1.0`.
# The value `0.0` is completely transparent and `1.0` is opaque.
#background_opacity: .9

scrolling:
  # Maximum number of lines in the scrollback buffer.
  # Specifying '0' will disable scrolling.
  history: 10000

# Live config reload (changes require restart)
live_config_reload: false

key_bindings:
  - { key: Up, mods: Control|Shift, action: IncreaseFontSize }
  - { key: Down, mods: Control|Shift, action: DecreaseFontSize }
  - { key: Home, mods: Control|Shift, action: ResetFontSize }
  - { key: Key0, mods: Control, action: None }
  - { key: Equals, mods: Control, action: None }
  - { key: Plus, mods: Control, action: None }
  - { key: Minus, mods: Control, action: None }

  - { key: Insert, mods: Shift, action: PasteSelection   }
  - { key: Y, mods: Control|Shift, action: PasteSelection }

  - { key: C, mods: Alt, action: ToggleViMode }

hints:
  alphabet: "ntesiroagmplfuwy"
  enabled:
    - regex: "(mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)\
              [^\u0000-\u001F\u007F-\u009F<>\" {-}\\^⟨⟩`]+"
      hyperlinks: true
      command: xdg-open
      post_processing: true
      mouse:
        enabled: true
        mods: None
      binding:
        key: L
        mods: Alt
    - regex: "(mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)\
              [^\u0000-\u001F\u007F-\u009F<>\" {-}\\^⟨⟩`]+"
      hyperlinks: true
      action: Copy
      post_processing: true
      mouse:
        enabled: true
        mods: None
      binding:
        key: Y
        mods: Alt
