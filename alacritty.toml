live_config_reload = false

[colors.bright]
black = "#928374"
blue = "#83a598"
cyan = "#8ec07c"
green = "#b8bb26"
magenta = "#d3869b"
red = "#fb4934"
white = "#ebdbb2"
yellow = "#fabd2f"

[colors.hints.end]
background = "#cc241d"
foreground = "#ebdbb2"

[colors.hints.start]
background = "#fb4934"
foreground = "#282828"

[colors.line_indicator]
background = "#282828"
foreground = "#d65d0e"

[colors.normal]
black = "#282828"
blue = "#458588"
cyan = "#689d6a"
green = "#98971a"
magenta = "#b16286"
red = "#cc241d"
white = "#a89984"
yellow = "#d79921"

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.search.focused_match]
background = "#79740e"
foreground = "#3c3836"

[colors.footer_bar]
background = "#3c3836"
foreground = "#b8bb26"

[colors.search.matches]
background = "#3c3836"
foreground = "#b8bb26"

[font]
size = 12.0

[font.normal]
family = "DejaVuSansMNerdFont"
style = "Regular"

[hints]
alphabet = "ntesiroagmplfuwy"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
regex = "(mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\" {-}\\^⟨⟩`]+"

[hints.enabled.binding]
key = "L"
mods = "Alt"

# don't open links on click
[hints.enabled.mouse]
enabled = false
mods = "None"

[[hints.enabled]]
action = "Copy"
hyperlinks = true
post_processing = true
regex = "(mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\" {-}\\^⟨⟩`]+"

[hints.enabled.binding]
key = "Y"
mods = "Alt"

# Copy on click
[hints.enabled.mouse]
enabled = true
mods = "None"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Up"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Down"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Home"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "None"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "Plus"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "PasteSelection"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "PasteSelection"
key = "Y"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "ToggleViMode"
key = "C"
mods = "Alt"

[scrolling]
history = 10000

[window]
decorations = "none"
